name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rag-helpdesk-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-rag-helpdesk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies: the offline path (tests + evals) is stdlib-only.
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Evals (offline, no secrets)
        run: python evals/run_evals.py
